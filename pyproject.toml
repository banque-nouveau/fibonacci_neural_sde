[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amgm"
version = "0.1.0"
description = "SEBx asset management"
requires-python = ">=3.12"

dependencies = [
    "packaging",
    "lightning",
    "matplotlib",
    "numba",
    "pandas",
    "polars",
    "pyarrow",
    "seaborn",
    "statsmodels",
    "openpyxl",
    "streamlit",
    "tensorboard",
    "vetiver",
    "yfinance"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
"git" = "https://github.com/banque-nouveau/asset_management"

[tool.hatch.build.targets.wheel]
packages = ["amgm", "Utils"]

[tool.black]
line-length = 120

### Tests ###
[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_format = "[%(levelname)s]: %(asctime)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

### Linting and formatting ###
[tool.ruff.lint]
# Rule set: https://docs.astral.sh/ruff/rules/
select = ["E", "F", "W"]
ignore = ["E501"]
line-length = 120